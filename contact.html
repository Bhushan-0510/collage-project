    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

<section class="container py-5">
  <h2 class="fw-bold mb-3">Contact Us</h2>
  <form class="row g-3" id="contactForm" novalidate>
    <div class="col-md-6">
      <label for="cname" class="form-label visually-hidden">Name</label>
      <input id="cname" name="name" type="text" class="form-control" placeholder="Name" required>
    </div>
    <div class="col-md-6">
      <label for="cemail" class="form-label visually-hidden">Email</label>
      <input id="cemail" name="email" type="email" class="form-control" placeholder="Email" required>
    </div>
    <div class="col-12">
      <label for="cmessage" class="form-label visually-hidden">Message</label>
      <textarea id="cmessage" name="message" class="form-control" rows="4" placeholder="Message" required></textarea>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>
  </form>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
