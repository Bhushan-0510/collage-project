<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><img src="assets/logo.png" alt="" srcset=""></a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="faculty.html">Faculty</a></li>
        <li class="nav-item"><a class="nav-link" href="syllabus.html">Syllabus</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item">
          <a class="btn btn-warning ms-lg-3" href="login.html">Login</a>
        </li>
      </ul>
    </div>
  </div>
</nav>


<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm p-4">
        <h4 class="text-center mb-3">Login</h4>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="userid" class="form-label visually-hidden">User ID</label>
            <input id="userid" name="userid" type="text" class="form-control" placeholder="User ID" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label visually-hidden">Password</label>
            <input id="password" name="password" type="password" class="form-control" placeholder="Password" required>
          </div>

          <div class="mb-3">
            <label for="role" class="form-label visually-hidden">Role</label>
            <select id="role" name="role" class="form-select" required>
              <option value="" selected disabled>Select role</option>
              <option value="student">Student</option>
              <option value="staff">Staff</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div class="d-grid mb-2">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>

          <div class="text-center">
            <a href="#" class="small">Forgot password?</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
